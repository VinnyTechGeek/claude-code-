<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor de Uso</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --border:#262a34;
    --text:#e8e9ed; --muted:#8b8f9a;
    --green:#4ade80; --yellow:#facc15; --red:#f87171; --blue:#60a5fa;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); padding:16px; max-width:480px; margin:0 auto;
  }
  h1{font-size:18px; margin:4px 0 16px; font-weight:600; text-align:center;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:18px; margin-bottom:12px;
  }
  .label{color:var(--muted); font-size:13px;}
  .row{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .heroCard{text-align:center; padding:22px 18px;}
  .heroVal{font-size:40px; font-weight:800; margin:6px 0 2px; color:var(--green);}
  .heroSub{font-size:12px; color:var(--muted);}
  .status{
    display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:600; margin-top:10px;
  }
  .ok{background:rgba(74,222,128,.15); color:var(--green);}
  .warn{background:rgba(250,204,21,.15); color:var(--yellow);}
  .bad{background:rgba(248,113,113,.15); color:var(--red);}
  form{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  input{
    background:#0f1115; border:1px solid var(--border); color:var(--text);
    padding:9px 10px; border-radius:8px; font-size:14px; flex:1; min-width:90px;
  }
  button{
    background:var(--blue); color:#08101d; border:none; padding:9px 14px;
    border-radius:8px; font-weight:600; font-size:14px; cursor:pointer;
  }
  button.secondary{background:#262a34; color:var(--text); font-size:12px; padding:6px 10px;}
  .entries{max-height:150px; overflow-y:auto; margin-top:10px;}
  .entry{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); font-size:13px;}
  .entry button{background:none; color:var(--red); padding:2px 6px; font-size:12px;}
  canvas{max-height:180px;}
  .settingsRow{display:flex; gap:8px; align-items:center; margin-top:8px;}
  .progressTrack{
    position:relative; height:10px; background:#0f1115; border-radius:999px;
    overflow:visible; border:1px solid var(--border); margin-top:12px;
  }
  .progressFill{
    position:absolute; top:0; left:0; height:100%; border-radius:999px;
    transition:width .3s;
  }
  .progressMarker{
    position:absolute; top:-3px; width:2px; height:16px; background:var(--text); opacity:.6;
  }
  .progressLabels{display:flex; justify-content:space-between; margin-top:6px; font-size:11px; color:var(--muted);}
  .footnote{font-size:11px; color:var(--muted); margin-top:10px; text-align:center;}
  details{margin-top:0;}
  summary{
    cursor:pointer; list-style:none; display:flex; justify-content:space-between;
    align-items:center; font-size:13px; color:var(--muted); padding:2px 0;
  }
  summary::-webkit-details-marker{display:none;}
  summary::after{content:'▾'; transition:transform .2s;}
  details[open] summary::after{transform:rotate(180deg);}
  .limitTable{margin-top:10px; max-height:260px; overflow-y:auto;}
  .limitRow{
    display:flex; justify-content:space-between; padding:7px 4px; font-size:13px;
    border-bottom:1px solid var(--border);
  }
  .limitRow.today{background:rgba(96,165,250,.1); border-radius:6px; font-weight:600;}
  .limitRow .d{color:var(--muted);}
  .limitRow.past{opacity:.45;}
</style>
</head>
<body>

<h1>💸 Monitor de uso</h1>

<div class="card heroCard">
  <div class="label">Você pode gastar</div>
  <div class="heroVal" id="canSpendToday">--</div>
  <div class="heroSub">por dia até o fim do mês</div>
  <div class="status" id="statusBadge">--</div>
</div>

<div class="card">
  <div class="row">
    <div>
      <div class="label">Gasto</div>
      <div style="font-size:20px; font-weight:700;" id="spentVal">--</div>
    </div>
    <div style="text-align:right;">
      <div class="label">de</div>
      <div style="font-size:20px; font-weight:700;" id="budgetVal">--</div>
    </div>
  </div>
  <div class="progressTrack">
    <div class="progressFill" id="progressFill"></div>
    <div class="progressMarker" id="progressMarker"></div>
  </div>
  <div class="progressLabels">
    <span id="dayCounter">--</span>
    <button class="secondary" onclick="toggleSettings()">Editar orçamento</button>
  </div>
  <div id="settingsBox" style="display:none;">
    <div class="settingsRow">
      <input type="number" id="budgetInput" placeholder="Orçamento (US$)" step="0.01">
      <button onclick="saveBudget()">Salvar</button>
    </div>
  </div>
</div>

<div class="card">
  <details id="limitDetails" ontoggle="onLimitToggle()">
    <summary>📅 Ver teto acumulado por dia</summary>
    <div class="limitTable" id="limitTable"></div>
  </details>
</div>

<div class="card">
  <canvas id="chart"></canvas>
</div>

<div class="card">
  <div class="label" style="margin-bottom:6px;">Registrar total acumulado do dia</div>
  <form onsubmit="addEntry(event)">
    <input type="date" id="entryDate" required>
    <input type="number" id="entryAmount" placeholder="US$ acumulado" step="0.01" required>
    <button type="submit">+</button>
  </form>
  <div class="entries" id="entriesList"></div>
</div>

<div class="footnote">Dados salvos só neste dispositivo.</div>

<script>
const STORAGE_KEY = 'usage-monitor-data';
let state = { budget: 200, entries: {} };
let chart = null;

function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function currentMonthKey(){ return todayISO().slice(0,7); }
function daysInMonth(year, month){ return new Date(year, month, 0).getDate(); }

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) state = JSON.parse(raw);
  }catch(e){}
  if(!state.entries) state.entries = {};
  if(!state.budget) state.budget = 200;
  render();
}
async function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
function toggleSettings(){
  const box = document.getElementById('settingsBox');
  document.getElementById('budgetInput').value = state.budget;
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
}
async function saveBudget(){
  const v = parseFloat(document.getElementById('budgetInput').value);
  if(!isNaN(v) && v > 0){
    state.budget = v;
    await saveState();
    render();
    toggleSettings();
  }
}
async function addEntry(ev){
  ev.preventDefault();
  const date = document.getElementById('entryDate').value;
  const amount = parseFloat(document.getElementById('entryAmount').value);
  if(date && !isNaN(amount)){
    state.entries[date] = amount;
    await saveState();
    document.getElementById('entryAmount').value = '';
    render();
  }
}
async function removeEntry(date){
  delete state.entries[date];
  await saveState();
  render();
}
function fmt(v){
  return 'US$ ' + v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function render(){
  document.getElementById('entryDate').value = todayISO();
  document.getElementById('budgetVal').textContent = fmt(state.budget);

  const monthKey = currentMonthKey();
  const [year, month] = monthKey.split('-').map(Number);
  const totalDays = daysInMonth(year, month);
  const todayDay = new Date().getDate();

  const monthEntries = Object.entries(state.entries)
    .filter(([d]) => d.startsWith(monthKey))
    .sort((a,b) => a[0].localeCompare(b[0]));

  const lastEntry = monthEntries.length ? monthEntries[monthEntries.length - 1] : null;
  const totalSpent = lastEntry ? lastEntry[1] : 0;
  const remaining = state.budget - totalSpent;

  const idealDailyRate = state.budget / totalDays;
  const idealSoFar = idealDailyRate * todayDay;
  const diff = totalSpent - idealSoFar;

  const daysRemaining = Math.max(totalDays - todayDay, 1);
  const dailyAllowanceLeft = remaining / daysRemaining;

  document.getElementById('spentVal').textContent = fmt(totalSpent);
  document.getElementById('dayCounter').textContent = `Dia ${todayDay}/${totalDays}`;

  const pctSpent = Math.min((totalSpent / state.budget) * 100, 100);
  const pctIdeal = Math.min((idealSoFar / state.budget) * 100, 100);
  const fill = document.getElementById('progressFill');
  fill.style.width = pctSpent + '%';
  fill.style.background = totalSpent > idealSoFar
    ? 'linear-gradient(90deg, var(--yellow), var(--red))'
    : 'linear-gradient(90deg, var(--blue), var(--green))';
  document.getElementById('progressMarker').style.left = pctIdeal + '%';

  document.getElementById('canSpendToday').textContent = fmt(dailyAllowanceLeft);
  document.getElementById('canSpendToday').style.color = dailyAllowanceLeft < idealDailyRate ? 'var(--yellow)' : 'var(--green)';

  const badge = document.getElementById('statusBadge');
  if(diff > state.budget*0.03){
    badge.textContent = `Acima do ritmo (+${fmt(diff)})`;
    badge.className = 'status bad';
  } else if(diff < -state.budget*0.03){
    badge.textContent = `Abaixo do ritmo (${fmt(diff)})`;
    badge.className = 'status ok';
  } else {
    badge.textContent = 'No ritmo';
    badge.className = 'status warn';
  }

  const list = document.getElementById('entriesList');
  list.innerHTML = '';
  monthEntries.slice().reverse().forEach(([date, amount]) => {
    const div = document.createElement('div');
    div.className = 'entry';
    const d = new Date(date+'T00:00:00');
    const dstr = d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
    div.innerHTML = `<span>${dstr} — ${fmt(amount)}</span><button onclick="removeEntry('${date}')">remover</button>`;
    list.appendChild(div);
  });

  renderChart(monthEntries, idealDailyRate, totalDays);
  renderLimitTable(idealDailyRate, totalDays, todayDay);
}

function renderLimitTable(idealDailyRate, totalDays, todayDay){
  const box = document.getElementById('limitTable');
  box.innerHTML = '';
  for(let day = 1; day <= totalDays; day++){
    const teto = idealDailyRate * day;
    const row = document.createElement('div');
    row.className = 'limitRow' + (day === todayDay ? ' today' : (day < todayDay ? ' past' : ''));
    row.innerHTML = `<span class="d">Dia ${day}${day === todayDay ? ' (hoje)' : ''}</span><span>${fmt(teto)}</span>`;
    box.appendChild(row);
  }
}

function renderChart(monthEntries, idealDailyRate, totalDays){
  const labels = [];
  const idealLine = [];
  const realLine = [];
  let lastKnown = null;
  const entryMap = Object.fromEntries(monthEntries);
  const monthKey = currentMonthKey();
  const todayDay = new Date().getDate();

  for(let day = 1; day <= totalDays; day++){
    const dateStr = monthKey + '-' + String(day).padStart(2,'0');
    labels.push(day);
    idealLine.push(+(idealDailyRate * day).toFixed(2));
    if(day <= todayDay){
      if(entryMap[dateStr] !== undefined) lastKnown = entryMap[dateStr];
      realLine.push(lastKnown === null ? null : +lastKnown.toFixed(2));
    } else {
      realLine.push(null);
    }
  }

  const ctx = document.getElementById('chart').getContext('2d');
  if(chart) chart.destroy();
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: 'Ideal', data: idealLine, borderColor: '#8b8f9a', borderDash: [5,5], pointRadius: 0, tension: 0 },
        { label: 'Real', data: realLine, borderColor: '#60a5fa', backgroundColor: 'rgba(96,165,250,0.15)', fill: true, pointRadius: 2, tension: 0.2 }
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: '#e8e9ed', font:{size:11} } } },
      scales: {
        x: { ticks:{ color:'#8b8f9a', font:{size:9} }, grid:{ color:'#262a34' } },
        y: { ticks:{ color:'#8b8f9a', font:{size:9} }, grid:{ color:'#262a34' } }
      }
    }
  });
}

function onLimitToggle(){
  const details = document.getElementById('limitDetails');
  if(details.open){
    setTimeout(() => {
      const todayRow = document.querySelector('.limitRow.today');
      if(todayRow) todayRow.scrollIntoView({block:'center'});
    }, 50);
  }
}

loadState();
</script>
</body>
</html>
